<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Simulator - Full Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">CS SIMULATOR</div>

            <nav class="tabs-nav">
                <button class="tab-btn active" data-tab="cases" onclick="switchTab('cases', this)">Skrzynki</button>
                <button class="tab-btn" data-tab="upgrader" onclick="switchTab('upgrader', this)">Upgrader</button>
                <button class="tab-btn" data-tab="mission" onclick="switchTab('mission', this)">Misje</button>
            </nav>

            <div class="profile-container">
                <div class="rank-info">
                    <span id="rankName">Rekrut</span>
                    <span class="level-badge">LVL <span id="userLevel">1</span></span>
                </div>
                <div class="xp-wrapper">
                    <div class="xp-bar-bg">
                        <div id="xpBar" class="xp-bar-fill"></div>
                    </div>
                    <span id="xpText">0 / 100 XP</span>
                </div>
            </div>

            <div class="balance-wrapper">
                <div class="balance-box">Saldo: <span id="balance">10.00</span>$</div>
                <button class="btn-deposit" onclick="toggleModal(true)">+ WPŁAĆ</button>
            </div>
        </header>

        <main id="caseSelection">
            <div class="grid" id="caseGrid"></div>
        </main>

        <section id="openerSection" class="hidden">
            <button class="btn-back" onclick="closeCase()">← POWRÓT</button>
            <h2 id="activeCaseName">Skrzynka</h2>
            <div class="roller-wrapper">
                <div class="marker"></div>
                <div id="roller" class="roller"></div>
            </div>
            <button id="openBtn" class="btn-open">OTWÓRZ ZA <span id="casePriceText">0.00</span>$</button>
        </section>

        <section id="upgraderSection" class="hidden">
            <h3>Upgrader</h3>
            <div class="upgrader-container">
                <div class="upgrade-slot">
                    <p>Twój przedmiot</p>
                    <div id="inputItemDisplay" class="item-placeholder">Wybierz z EQ</div>
                </div>
                <div class="upgrade-controls">
                    <div class="chance-display"><span id="upgradeChance">0</span>%</div>
                    <div class="target-box">
                        Cel ($): <input type="number" id="targetValue" value="10" oninput="calculateChance()">
                    </div>
                    <button id="btnUpgrade" class="btn-upgrade" disabled onclick="processUpgrade()">ULEPSZ</button>
                </div>
                <div class="upgrade-slot">
                    <p>Szansa na wygraną</p>
                    <div id="resultItemDisplay" class="item-placeholder">???</div>
                </div>
            </div>
        </section>

        <section id="contractSection" class="hidden">
            <h3>Kontrakty (10 skinów)</h3>
            <div id="contractSlots" class="contract-grid"></div>
            <button id="btnContract" class="btn-contract" disabled onclick="processContract()">PODPISZ KONTRAKT (<span
                    id="contractCount">0</span>/10)</button>
        </section>

        <section id="missionSection" class="hidden">
            <h3>Misje Codzienne</h3>
            <div id="missionList" class="mission-grid"></div>

        </section>

        <section class="inventory-section">
            <div class="inventory-header">
                <h3>Ekwipunek</h3>
                <span id="statsInventoryValue">0.00$</span>
            </div>
            <div id="inventory" class="inventory-grid"></div>
        </section>
    </div>

    <div id="depositModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modalTitle">Doładuj saldo</h2>

            <div id="paymentMenu" class="payment-methods">
                <button class="method-btn" onclick="openPayment('BLIK')">BLIK</button>
                <button class="method-btn" onclick="openPayment('PayPal')">PayPal</button>
                <button class="method-btn" onclick="openPayment('Karta')">Debit Card</button>
                <button class="method-btn" onclick="openPayment('GiftCard')">Gift Card</button>
            </div>

            <div id="form-BLIK" class="payment-form hidden">
                <p>Kod BLIK (6 cyfr):</p>
                <input type="number" id="blikCode" placeholder="000 000"
                    oninput="if(this.value.length > 6) this.value = this.value.slice(0, 6);">
                <input type="number" id="blikAmount" placeholder="Kwota $">
                <button class="btn-deposit-confirm" onclick="confirmPayment('BLIK')">ZAPŁAĆ</button>
            </div>

            <div id="form-PayPal" class="payment-form hidden">
                <p>Logowanie PayPal:</p>
                <input type="email" id="ppEmail" placeholder="E-mail">
                <input type="password" id="ppPass" placeholder="Hasło">
                <input type="number" id="ppAmount" placeholder="Kwota $">
                <button class="btn-deposit-confirm" onclick="confirmPayment('PayPal')">ZALOGUJ I ZAPŁAĆ</button>
            </div>

            <div id="form-Karta" class="payment-form hidden">
                <p>Dane karty:</p>
                <input type="text" id="cardNum" placeholder="Numer karty (16 cyfr)">
                <div style="display:flex; gap: 10px;">
                    <input type="text" id="cardDate" placeholder="MM/RR">
                    <input type="text" id="cardCVC" placeholder="CVC">
                </div>
                <input type="number" id="cardAmount" placeholder="Kwota $">
                <button class="btn-deposit-confirm" onclick="confirmPayment('Karta')">AUTORYZUJ</button>
            </div>

            <div id="form-GiftCard" class="payment-form hidden">
                <p>Twój kod podarunkowy:</p>
                <input type="text" id="giftCode" placeholder="XXXX-XXXX-XXXX">
                <button class="btn-deposit-confirm" onclick="confirmPayment('GiftCard')">ZREALIZUJ</button>
            </div>

            <div class="modal-footer">
                <button class="btn-close-modal" onclick="resetAndCloseModal()">POWRÓT / ZAMKNIJ</button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/xp.js"></script>
    <script src="js/quests.js"></script>
    <script src="js/gift-cards.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
